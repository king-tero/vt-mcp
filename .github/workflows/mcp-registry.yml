name: MCP Registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify identity, publish, retire or restore one reviewed Registry version
        required: true
        default: verify-identity
        type: choice
        options: [verify-identity, publish, retire, restore]
      reviewed_sha:
        description: Full main commit SHA accepted by independent QA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate the pinned remote manifest without credentials
        run: python3 scripts/registry.py validate

  registry:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      ((github.repository == 'VirusTotal/virustotal-mcp' && github.repository_id == '1361592455') ||
       (github.repository == 'king-tero/vt-mcp' && github.repository_id == '1359828317'))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Run the reviewed Registry operation with ephemeral OIDC authentication
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          REGISTRY_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/registry.py run
      - name: Retain sanitized Registry result, including uncertain operations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/registry-result.json
            ${{ runner.temp }}/registry-mutation-intent.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

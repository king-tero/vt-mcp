name: MCP Registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full main commit SHA accepted by independent QA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate the public manifest without credentials
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1359828317'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the reviewed commit and its successful main CI
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          sha = os.environ['REVIEWED_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', sha) or sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatch must target the exact reviewed main commit')
          endpoint = (
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs"
              f'?head_sha={sha}&event=push&branch=main&per_page=10'
          )
          result = subprocess.run(['gh', 'api', endpoint], capture_output=True, check=True)
          runs = json.loads(result.stdout)['workflow_runs']
          if not any(run['head_sha'] == sha and run['head_branch'] == 'main'
                     and run['event'] == 'push' and run['status'] == 'completed'
                     and run['conclusion'] == 'success' for run in runs):
              raise SystemExit('This commit needs a successful main CI run before publication')
          PY
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate with GitHub OIDC and publish
        run: |
          trap '"$RUNNER_TEMP/mcp-publisher" logout' EXIT
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Verify the published version through the anonymous API
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path('server.json').read_text())
          name = urllib.parse.quote(manifest['name'], safe='')
          version = urllib.parse.quote(manifest['version'], safe='')
          url = f'https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}'
          with urllib.request.urlopen(url, timeout=30) as response:
              published = json.load(response)
          if published['server'] != manifest:
              raise SystemExit('Published metadata differs from the reviewed manifest')
          registry = published['_meta']['io.modelcontextprotocol.registry/official']
          if registry['status'] != 'active':
              raise SystemExit('The published version is not active')
          print(f'Verified active registry entry: {url}')
          PY
